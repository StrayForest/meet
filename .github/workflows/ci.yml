name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Context budget
        run: node scripts/check-context-budget.mjs

      - name: Architecture contracts
        run: node scripts/check-architecture-contracts.mjs

      - name: Business contracts
        run: node scripts/check-business-contracts.mjs

      - name: Validation scope
        run: node scripts/check-validation-scope.mjs

      - name: Pre-development gate
        run: node scripts/check-pre-dev-gate.mjs
