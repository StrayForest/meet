name: Predevelopment contracts

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predevelopment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  predevelopment-contracts:
    name: predevelopment-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Runtime version
        run: node --version

      - name: Context budget contracts
        run: node scripts/check-context-budget.mjs

      - name: Architecture contracts
        run: node scripts/check-architecture-contracts.mjs

      - name: Business contracts
        run: node scripts/check-business-contracts.mjs

      - name: MVP validation scope
        run: node scripts/check-validation-scope.mjs

      - name: Predevelopment readiness
        run: node scripts/check-predevelopment-readiness.mjs

      - name: Documentation links
        run: node scripts/check-doc-links.mjs

      - name: Public repository hygiene
        run: node scripts/check-public-repo-hygiene.mjs
